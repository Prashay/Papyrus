name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or "master" if your primary branch is called master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Compile production build
        run: npm run build

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload static website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Live Link
        id: deployment
        uses: actions/deploy-pages@v4
