<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Papyrus is a local-first studio for reading and editing Word documents and annotating PDFs — right in your browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400;1,6..72,600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem('papyrus-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch {}
    </script>
    <title>Papyrus — Documents, quietly powerful</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
